<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ посещаемости учреждений культуры ЛНР</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#15212b;--muted:#687782;--line:#dce5e8;--paper:#f5f8f8;--card:#fff;--blue:#1677a8;--orange:#e88942;--lime:#d8e9dc;--navy:#163d4c}
 *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}header{background:var(--navy);color:#fff;padding:42px max(24px,calc((100% - 1240px)/2)) 38px}h1{font:700 clamp(27px,4vw,48px)/1.06 Georgia,serif;max-width:900px;margin:12px 0}.eyebrow{color:#a8d9d2;text-transform:uppercase;letter-spacing:.16em;font-size:11px}.subtitle{color:#c1d1d5;max-width:650px;margin:12px 0 0}.wrap{max-width:1240px;margin:0 auto;padding:24px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #173a4410}.upload{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;padding:18px;margin-bottom:18px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:0 0 7px}.file{border:1px dashed #9eb4b8;border-radius:10px;padding:12px;background:#fbfdfd;width:100%;font-size:13px}.button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer}.button:disabled{opacity:.4;cursor:not-allowed}.filters{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;color:var(--ink)}.multi{padding:6px}.multi option{padding:5px}.select-help{display:block;color:var(--muted);font-size:11px;margin-top:5px}.hint{color:var(--muted);font-size:13px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{padding:17px}.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.stat-value{font:bold 25px Georgia,serif;margin-top:6px}.chart-card{padding:20px;margin-bottom:18px}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.chart-title{font:700 22px Georgia,serif;margin:0}.legend{display:flex;gap:15px;color:var(--muted);font-size:13px;white-space:nowrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.chart{width:100%;height:380px;margin-top:18px}.chart svg{width:100%;height:100%;overflow:visible}.gridline{stroke:#e4ecee;stroke-width:1}.axis{fill:#74848b;font-size:12px}.line25{fill:none;stroke:var(--blue);stroke-width:3}.line26{fill:none;stroke:var(--orange);stroke-width:3}.point25{fill:#fff;stroke:var(--blue);stroke-width:2}.point26{fill:#fff;stroke:var(--orange);stroke-width:2}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed #b8c9cc;border-radius:12px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th,.data-table td{padding:10px;border-bottom:1px solid var(--line);text-align:right}.data-table th:first-child,.data-table td:first-child{text-align:left}.data-table th{color:var(--muted);font-size:11px;text-transform:uppercase}.status{color:var(--muted);font-size:13px;margin:10px 0 0}.hidden{display:none}@media(max-width:1050px){.filters{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.upload,.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.chart{height:300px}.chart-head{display:block}.legend{margin-top:12px;white-space:normal}.wrap{padding:14px}header{padding:30px 18px}}
</style>
</head>
<body>
<header><div class="eyebrow">Аналитика · 2025 / 2026</div><h1>Анализ посещаемости учреждений культуры ЛНР</h1></header>
<main class="wrap">
<section class="panel upload">
 <div class="field"><label for="file25">Файл за 2025 год</label><input class="file" id="file25" type="file" accept=".xlsx,.xls"></div>
 <div class="field"><label for="file26">Файл за 2026 год</label><input class="file" id="file26" type="file" accept=".xlsx,.xls"></div>
 <button class="button" id="load" disabled>Загрузить данные</button>
 <p class="status" id="status" style="grid-column:1/-1">Выберите два Excel-файла из рабочей папки.</p>
</section>
<section id="app" class="hidden">
 <div class="panel filters">
  <div class="field"><label for="type">Тип учреждения</label><select class="select" id="type"><option value="*">Все типы учреждений</option></select></div>
  <div class="field"><label for="district">Муниципалитеты</label><select class="select multi" id="district" multiple size="5" title="Для выбора нескольких значений используйте Ctrl или Shift"><option value="*">Все муниципалитеты</option></select><small class="select-help">Ctrl + щелчок — несколько значений</small></div>
  <div class="field"><label for="institution">Учреждения</label><select class="select multi" id="institution" multiple size="5" title="Для выбора нескольких значений используйте Ctrl или Shift"><option value="*">Все учреждения</option></select><small class="select-help">Ctrl + щелчок — несколько значений</small></div>
  <div class="field"><label for="periodStart">Период: с</label><select class="select" id="periodStart"></select></div>
  <div class="field"><label for="periodEnd">Период: по</label><select class="select" id="periodEnd"></select></div>
 </div>
 <p class="hint" id="scope"></p>
 <div class="stats"><div class="card"><div class="stat-label">Учреждений в выборке</div><div class="stat-value" id="count">0</div></div><div class="card"><div class="stat-label">2025, всего</div><div class="stat-value" id="total25">0</div></div><div class="card"><div class="stat-label">2026, всего</div><div class="stat-value" id="total26">0</div></div><div class="card"><div class="stat-label">Изменение</div><div class="stat-value" id="change">0%</div></div></div>
 <section class="card chart-card"><div class="chart-head"><h2 class="chart-title">Посещения по месяцам</h2><div class="legend"><span><i class="dot" style="background:#1677a8"></i>2025</span><span><i class="dot" style="background:#e88942"></i>2026</span></div></div><div class="chart" id="chart"></div></section>
 <section class="card chart-card"><h2 class="chart-title">Таблица сравнения</h2><div class="table-wrap" id="table"></div></section>
</section>
</main>
<script>
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const TYPE_NAMES={'431 Библиотеки':'Библиотеки','432 КДУ':'Культурно-досуговые учреждения','433 Музеи':'Музеи','434 Театры':'Театры','435 ПКиО':'Парки культуры и отдыха','436 Концерты':'Концертные организации','437 Цирки':'Цирки','438 Зоопарки':'Зоопарки','439 ДШИ':'Детские школы искусств'};
let records=[];
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
function text(v){return v==null?'':String(v).replace(/\s+/g,' ').trim()}
function parseBook(book,year){
 const result=[]; for(const [sheet,type] of Object.entries(TYPE_NAMES)){const ws=book.Sheets[sheet];if(!ws)continue;const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const header=rows.findIndex(r=>text(r[0])==='№ п/п'); if(header<0)continue; const h=rows[header];
  const nameCol=h.findIndex(v=>text(v).toLowerCase().includes('наименование организации')); const districtCol=h.findIndex(v=>text(v).toLowerCase().startsWith('район'));
  const starts=MONTHS.map(month=>h.findIndex(v=>text(v)===month)); if(nameCol<0||districtCol<0||starts.some(x=>x<0))continue;
  let rowStart=header+1; while(rowStart<rows.length&&(!Number.isFinite(Number(rows[rowStart]?.[0]))||!text(rows[rowStart]?.[nameCol])||/^\d+$/.test(text(rows[rowStart]?.[nameCol]))))rowStart++;
   for(let r=rowStart;r<rows.length;r++){const row=rows[r];if(!Number.isFinite(Number(row[0]))||!text(row[nameCol]))continue;const values=starts.map(c=>Number(row[c])||0),filled=starts.map(c=>row[c]!==null&&row[c]!==undefined&&text(row[c])!=='');result.push({year,type,name:text(row[nameCol]),district:text(row[districtCol]),values,filled});}
 } return result;
}
async function read(file,year){return parseBook(XLSX.read(await file.arrayBuffer(),{type:'array'}),year)}
function options(select,values,all,selected=[]){select.innerHTML=`<option value="*">${all}</option>`+values.sort((a,b)=>a.localeCompare(b,'ru')).map(v=>`<option value="${escapeHtml(v)}"${selected.includes(v)?' selected':''}>${escapeHtml(v)}</option>`).join('')}
function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selected(select){const values=[...select.selectedOptions].map(o=>o.value);return !values.length||values.includes('*')?null:values}
function period(){let start=Number($('periodStart').value),end=Number($('periodEnd').value);if(start>end){[start,end]=[end,start];$('periodStart').value=start;$('periodEnd').value=end}return {start,end}}
function updateFilters(){const type=$('type').value,oldDistrict=selected($('district'))||[],oldInstitution=selected($('institution'))||[];const base=records.filter(x=>type==='*'||x.type===type);const districts=[...new Set(base.map(x=>x.district).filter(Boolean))];options($('district'),districts,'Все муниципалитеты',oldDistrict);const district=selected($('district'));const base2=base.filter(x=>!district||district.includes(x.district));const names=[...new Set(base2.map(x=>x.name))];options($('institution'),names,'Все учреждения',oldInstitution.filter(v=>names.includes(v)))}
function draw(){const type=$('type').value,district=selected($('district')),institution=selected($('institution')),range=period();const filtered=records.filter(x=>(type==='*'||x.type===type)&&(!district||district.includes(x.district))&&(!institution||institution.includes(x.name)));const byYear=y=>MONTHS.map((_,i)=>{if(!filtered.some(x=>x.year===2026&&x.filled[i]))return null;return filtered.filter(x=>x.year===y).reduce((s,x)=>s+x.values[i],0)});const a=byYear(2025).slice(range.start,range.end+1),b=byYear(2026).slice(range.start,range.end+1),months=MONTHS.slice(range.start,range.end+1),sum25=a.reduce((s,x)=>s+(x||0),0),sum26=b.reduce((s,x)=>s+(x||0),0);$('count').textContent=new Set(filtered.map(x=>x.name)).size;$('total25').textContent=fmt(sum25);$('total26').textContent=fmt(sum26);$('change').textContent=(sum25?((sum26/sum25-1)*100):0).toFixed(1).replace('.',',')+'%';$('scope').textContent=`Показаны ${filtered.length?`данные ${new Set(filtered.map(x=>x.name)).size} учреждений`:'нет данных'} · период: ${MONTHS[range.start]} — ${MONTHS[range.end]}; незаполненные месяцы 2026 года исключены.`;renderChart(a,b,months);renderTable(a,b,months)}
function renderChart(a,b,months){const w=1000,h=350,p={l:58,r:18,t:16,b:40},all=[...a,...b].filter(v=>v!==null),max=Math.max(...all,1),x=i=>p.l+i*(w-p.l-p.r)/Math.max(a.length-1,1),y=v=>p.t+(h-p.t-p.b)*(1-v/max),path=data=>data.map((v,i)=>v===null?'':(i?'L':'M')+` ${x(i)} ${y(v)}`).join('');let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Сравнение посещаемости по месяцам">`;for(let i=0;i<5;i++){const v=max*i/4,yy=y(v);s+=`<line class="gridline" x1="${p.l}" x2="${w-p.r}" y1="${yy}" y2="${yy}"/><text class="axis" x="${p.l-9}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}s+=`<path class="line25" d="${path(a)}"/><path class="line26" d="${path(b)}"/>`;[a,b].forEach((arr,j)=>arr.forEach((v,i)=>{if(v!==null)s+=`<circle class="point${j?'26':'25'}" cx="${x(i)}" cy="${y(v)}" r="4"><title>${months[i]} ${j?2026:2025}: ${fmt(v)}</title></circle>`}));months.forEach((m,i)=>s+=`<text class="axis" x="${x(i)}" y="${h-12}" text-anchor="middle">${m.slice(0,3)}</text>`);$('chart').innerHTML=s+'</svg>'}
function renderTable(a,b,months){$('table').innerHTML=`<table class="data-table"><thead><tr><th>Месяц</th><th>2025</th><th>2026</th><th>Изменение</th></tr></thead><tbody>${months.map((m,i)=>`<tr><td>${m}</td><td>${fmt(a[i])}</td><td>${b[i]===null?'—':fmt(b[i])}</td><td>${b[i]===null||!a[i]?'—':((b[i]/a[i]-1)*100).toFixed(1).replace('.',',')+'%'}</td></tr>`).join('')}</tbody></table>`}
function initPeriod(){$('periodStart').innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('periodEnd').innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('periodStart').value='0';$('periodEnd').value='11'}
async function load(){const f25=$('file25').files[0],f26=$('file26').files[0];$('status').textContent='Читаю книги Excel…';try{records=[...(await read(f25,2025)),...(await read(f26,2026))];if(!records.length)throw Error('Не найдены подходящие листы или строки учреждений.');options($('type'),[...new Set(records.map(x=>x.type))],'Все типы учреждений');initPeriod();updateFilters();draw();$('app').classList.remove('hidden');$('status').textContent=`Загружено строк: ${records.length}.`; }catch(e){$('status').textContent='Ошибка: '+e.message}}
['file25','file26'].forEach(id=>$(id).addEventListener('change',()=>{$('load').disabled=!($('file25').files[0]&&$('file26').files[0])}));$('load').addEventListener('click',load);$('type').addEventListener('change',()=>{updateFilters();draw()});['district','institution'].forEach(id=>$(id).addEventListener('change',()=>{const select=$(id),all=select.options[0];if([...select.selectedOptions].some(o=>o!==all))all.selected=false;updateFilters();draw()}));['periodStart','periodEnd'].forEach(id=>$(id).addEventListener('change',draw));
</script>
</body></html>
